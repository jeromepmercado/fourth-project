<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demon Slayer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/dsLogo.png">
    <style>
        * {
            transition: 300ms;
        }

        body {
            margin: 0;
            /* make page tall */
            background: linear-gradient(160deg,
                    #171722,
                    #151d2f,
                    #0c0724,
                    #030122);
            background-attachment: fixed;
        }
    </style>
</head>

<body>

    <!-- navbar -->
    <div class="container pt-2 position-sticky top-0 z-1">
        <nav class="navbar px-3 py-1 rounded-5 navbar-expand-lg navbar-custom d-flex justify-content-between">
            <a class="navbar-brand" href="#home">
                <img src="assets/images/dsLogo.png" alt="Demon Slayer Logo" width="60" height="60">
            </a>
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbar"
                aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">ABOUT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="characters.html">CHARACTERS</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- characters-section -->
    <div class="container">
        <div class="row mt-3">
            <div class="col-12 text-center">
                <h1 class="charac-title ext-light">CHARACTERS</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-12 text-center text-white">
                <div class="mb-3" id="pageText">
                    Page 1
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <nav aria-label="Page navigation example">
                    <ul class="pagination justify-content-center bg-transparent">
                        <li class="page-item">
                            <a class="page-link" href="#" aria-label="Previous" onclick="prevPage()">
                                <span aria-hidden="true">&laquo; Back</span>
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="#" aria-label="Next" onclick="nextPage()">
                                <span aria-hidden="true">Next &raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="row" id="charactersArea">

        </div>
    </div>



    <!-- javascript-->
    <script>
        const colors = {
            Human: "#1a00c6",
            Demon: "#c60000"
        };

        var contents = document.getElementById("charactersArea");
        var pageText = document.getElementById("pageText");
        var page = 1;
        var characters = []; 

        function nextPage() {
            page++;
            contents.innerHTML = "";
            pageText.innerHTML = "Page " + page;
            showCharacters();
        }

        function prevPage() {
            if (page > 1) {
                page--;
                contents.innerHTML = "";
                pageText.innerHTML = "Page " + page;
                showCharacters();
            }
        }

        const getCharacters = async () => {
            const response = await fetch(
                "https://www.demonslayer-api.com/api/v1/characters?limit=45"
            );
            const data = await response.json();
            characters = data.content;
            showCharacters();
        };

        const showCharacters = () => {
            for (var i = (page * 10) - 9; i <= page * 10; i++) {

                const character = characters[i - 1];
                const raceColor = colors[character.race] || "#555";

                contents.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card my-3 shadow rounded-4 bg-dark text-white">
            <img src="${character.image}"
                 class="card-img-top"
                 style="height:300px; object-fit:cover">

            <div class="card-body text-center">
              <h5 class="card-title">${character.name}</h5>

              <div class="rounded-pill py-1 px-3 mt-2"
                   style="background-color:${raceColor}">
                ${character.race}
              </div>
            </div>
          </div>
        </div>
      `;
            }
        };

        getCharacters();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
